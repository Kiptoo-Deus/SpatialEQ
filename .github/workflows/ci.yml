name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S DSP -B build/dsp -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/dsp --config Release
      - name: Test
        run: ctest --test-dir build/dsp -C Release --output-on-failure

  macos:
    name: macOS (app + VST3 + AU installer)
    needs: dsp-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/ui/package-lock.json
      - name: Build and package (universal, ad-hoc signed; runs the Steinberg validator)
        env:
          CMAKE: cmake
        run: macos/scripts/package_all.sh
      - name: Install and validate the Audio Unit
        run: |
          sudo installer -pkg build/release-macos/SpatialEQ-*-macOS.pkg -target /
          ls -d /Applications/SpatialEQ.app /Library/Audio/Plug-Ins/VST3/SpatialEQ.vst3 /Library/Audio/Plug-Ins/Components/SpatialEQ.component
          # Make the Audio Unit registry notice the newly installed component, then validate it.
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aufx SqEQ SvDP > auval.log 2>&1 || { tail -40 auval.log; exit 1; }
          tail -3 auval.log
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialEQ-macOS
          path: build/release-macos/*

  ios:
    name: iOS app
    needs: dsp-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project SpatialEQ-iOS.xcodeproj -scheme SpatialEQ -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO build | tail -20

  windows:
    name: Windows (app + VST3 installer)
    needs: dsp-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/ui/package-lock.json
      - name: Build the interface (shared by the app and the VST3)
        working-directory: plugin/ui
        run: |
          npm ci
          npm run build
      - name: Build and test the app
        shell: bash # stops at the first failing command (PowerShell would carry on)
        run: |
          cmake -S windows -B build/windows -A x64
          cmake --build build/windows --config Release
          ctest --test-dir build/windows -C Release --output-on-failure
      - name: Build the VST3 (runs the Steinberg validator)
        shell: bash
        run: |
          cmake -S plugin -B build/plugin -A x64
          cmake --build build/plugin --config Release --target SpatialEQ validator
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $version = (Select-String -Path windows/CMakeLists.txt -Pattern 'project\(SpatialEQ VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$version" `
            "/DAppExe=$PWD\build\windows\Release\SpatialEQ.exe" `
            "/DBundle=$PWD\build\plugin\VST3\Release\SpatialEQ.vst3" `
            "/DOutDir=$PWD\out" windows\installer\SpatialEQ-Windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install it and check the app and the VST3
        shell: pwsh
        run: |
          $setup = Get-ChildItem out\SpatialEQ-*-windows-x64-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait
          $vst3 = "$env:CommonProgramFiles\VST3\SpatialEQ.vst3"
          foreach ($f in "$env:ProgramFiles\Savannah DSP\SpatialEQ\SpatialEQ.exe",
                         "$vst3\Contents\x86_64-win\SpatialEQ.vst3", "$vst3\PlugIn.ico", "$vst3\desktop.ini") {
            if (-not (Test-Path $f)) { Get-Content install.log -Tail 40; throw "missing after install: $f" }
            Write-Output "installed: $f"
          }
          if (-not ((Get-Item $vst3).Attributes -band [IO.FileAttributes]::System)) { throw "VST3 folder icon not enabled" }
          $validator = Get-ChildItem build\plugin -Recurse -Filter validator.exe | Select-Object -First 1
          & $validator.FullName $vst3 | Select-String "Result:"
          if ($LASTEXITCODE -ne 0) { throw "validator failed on the installed plug-in" }
      - name: Launch the installed app and screenshot it
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\Savannah DSP\SpatialEQ\SpatialEQ.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "SpatialEQ.exe exited (code $($p.ExitCode))" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\out\screenshot.png")
          Stop-Process $p -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialEQ-Windows
          path: out/*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpatialEQ-Windows-screenshot
          path: out/screenshot.png
          if-no-files-found: ignore

  android:
    name: Android app
    needs: dsp-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Release signing (only when the repository has signing secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf "storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n" \
            "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties
      - name: Build APK and App Bundle
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
        run: |
          # Empty repository variables fall back to the test IDs in gradle.properties.
          [ -n "$ORG_GRADLE_PROJECT_ADMOB_APP_ID" ] || unset ORG_GRADLE_PROJECT_ADMOB_APP_ID
          [ -n "$ORG_GRADLE_PROJECT_ADMOB_BANNER_ID" ] || unset ORG_GRADLE_PROJECT_ADMOB_BANNER_ID
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SpatialEQ-android.apk
          cp app/build/outputs/bundle/release/app-release.aab out/SpatialEQ-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialEQ-Android
          path: android/out/*
