name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp-tests:
    name: DSP tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S DSP -B build/dsp -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/dsp --config Release
      - name: Test
        run: ctest --test-dir build/dsp -C Release --output-on-failure

  macos:
    name: macOS (app + VST3 + AU installer)
    needs: dsp-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/ui/package-lock.json
      - name: Build and package (universal, ad-hoc signed; runs the Steinberg validator)
        env:
          CMAKE: cmake
        run: macos/scripts/package_all.sh
      - name: Install and validate the Audio Unit
        run: |
          sudo installer -pkg build/release-macos/SpatialEQ-*-macOS.pkg -target /
          ls -d /Applications/SpatialEQ.app /Library/Audio/Plug-Ins/VST3/SpatialEQ.vst3 /Library/Audio/Plug-Ins/Components/SpatialEQ.component
          # Make the Audio Unit registry notice the newly installed component, then validate it.
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aufx SqEQ SvDP > auval.log 2>&1 || { tail -40 auval.log; exit 1; }
          tail -3 auval.log
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialEQ-macOS
          path: build/release-macos/*

  ios:
    name: iOS app
    needs: dsp-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project SpatialEQ-iOS.xcodeproj -scheme SpatialEQ -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/xcode \
            CODE_SIGNING_ALLOWED=NO build | tail -20

  windows:
    name: Windows app
    needs: dsp-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S windows -B build/windows -A x64
      - name: Build
        run: cmake --build build/windows --config Release
      - name: Test
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package (setup program and portable zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $version = (Select-String -Path windows/CMakeLists.txt -Pattern 'project\(SpatialEQ VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$version" `
            "/DAppExe=$PWD\build\windows\Release\SpatialEQ.exe" "/DOutDir=$PWD\out" windows\installer\SpatialEQ.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/Release/SpatialEQ.exe -DestinationPath out/SpatialEQ-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialEQ-Windows
          path: out/*

  vst3-windows:
    name: VST3 plug-in (Windows)
    needs: dsp-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/ui/package-lock.json
      - name: Build the UI
        working-directory: plugin/ui
        run: |
          npm ci
          npm run build
      - name: Configure
        run: cmake -S plugin -B build/plugin -A x64
      - name: Build (runs the Steinberg validator)
        run: cmake --build build/plugin --config Release --target SpatialEQ
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Package (setup program and zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $version = (Select-String -Path plugin/CMakeLists.txt -Pattern 'project\(SpatialEQPlugin VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DVersion=$version" `
            "/DBundle=$PWD\build\plugin\VST3\Release\SpatialEQ.vst3" "/DOutDir=$PWD\out" plugin\installer\SpatialEQ-VST3.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/plugin/VST3/Release/SpatialEQ.vst3 -DestinationPath out/SpatialEQ-VST3-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialEQ-VST3-Windows
          path: out/*

  android:
    name: Android app
    needs: dsp-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Release signing (only when the repository has signing secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf "storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n" \
            "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties
      - name: Build APK and App Bundle
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
        run: |
          # Empty repository variables fall back to the test IDs in gradle.properties.
          [ -n "$ORG_GRADLE_PROJECT_ADMOB_APP_ID" ] || unset ORG_GRADLE_PROJECT_ADMOB_APP_ID
          [ -n "$ORG_GRADLE_PROJECT_ADMOB_BANNER_ID" ] || unset ORG_GRADLE_PROJECT_ADMOB_BANNER_ID
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SpatialEQ-android.apk
          cp app/build/outputs/bundle/release/app-release.aab out/SpatialEQ-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: SpatialEQ-Android
          path: android/out/*
