name: Release

# Push a tag like v1.1.0 to build every platform and publish a GitHub Release with the installers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # for docs/release-notes
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          rm -f artifacts/SHA256SUMS*.txt
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          # Hand-written notes from docs/release-notes/<tag>.md when present, else GitHub's generated ones.
          notes=(--generate-notes)
          if [ -f "docs/release-notes/$GITHUB_REF_NAME.md" ]; then notes=(--notes-file "docs/release-notes/$GITHUB_REF_NAME.md"); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "SpatialEQ $GITHUB_REF_NAME" "${notes[@]}" artifacts/*
