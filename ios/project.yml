name: SpatialEQ-iOS
options:
  bundleIdPrefix: com.savannahdsp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
targets:
  SpatialEQ:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../shared/Swift
        group: Shared
      - path: ../DSP/src
        group: DSP
      - path: ../DSP/include
        group: DSP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.savannahdsp.spatialeq.ios
        PRODUCT_NAME: SpatialEQ
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/Support/SpatialEQ-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../DSP/include
        GCC_OPTIMIZATION_LEVEL: "3"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3CLZZP3Y72
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: SpatialEQ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSMotionUsageDescription: SpatialEQ uses your headphones' motion sensors so virtual sound sources stay in place when you turn your head.
        NSHumanReadableCopyright: "© 2026 Savannah DSP"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
